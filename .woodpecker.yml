when:
  event:
    - push
    - manual
    - cron

variables:
  - &go_image "10.15.39.22:5000/ci-builder:latest"

steps:
  # lint:
  #   image: *go_image
  #   when:
  #     event: [push, manual, cron]
  #   commands:
  #     - go vet ./...

  # build:
  #   image: *go_image
  #   when:
  #     event: [push, manual, cron]
  #   commands:
  #     - go build ./...

  acceptance_test:
    image: *go_image
    when:
      event: [manual]
    environment:
      TF_ACC: "1"
      MSO_URL:
        from_secret: MSO_URL
      MSO_USERNAME:
        from_secret: MSO_USERNAME
      MSO_PASSWORD:
        from_secret: MSO_PASSWORD

    commands:
      - |
        ACC_TEST_REGEX="$${ACC_TEST_REGEX:-$${CI_BUILD_PARAM_ACC_TEST_REGEX:-$${CI_PIPELINE_PARAM_ACC_TEST_REGEX:-^TestAccMSOSchemaTemplateBd.*}}}"
        ACC_TIMEOUT="$${ACC_TIMEOUT:-$${CI_BUILD_PARAM_ACC_TIMEOUT:-$${CI_PIPELINE_PARAM_ACC_TIMEOUT:-600m}}}"

        echo "Running acceptance tests (regex $${ACC_TEST_REGEX}, timeout $${ACC_TIMEOUT})"

        TF_LOG="$${TF_LOG:-$${CI_BUILD_PARAM_TF_LOG:-$${CI_PIPELINE_PARAM_TF_LOG:-}}}" \
        MSO_PLATFORM="$${MSO_PLATFORM:-$${CI_BUILD_PARAM_MSO_PLATFORM:-$${CI_PIPELINE_PARAM_MSO_PLATFORM:-nd}}}" \
        APIC_URL="$${APIC_URL:-$${CI_BUILD_PARAM_APIC_URL:-$${CI_PIPELINE_PARAM_APIC_URL:-}}}" \
        APIC_USERNAME="$${APIC_USERNAME:-$${CI_BUILD_PARAM_APIC_USERNAME:-$${CI_PIPELINE_PARAM_APIC_USERNAME:-}}}" \
        APIC_PASSWORD="$${APIC_PASSWORD:-$${CI_BUILD_PARAM_APIC_PASSWORD:-$${CI_PIPELINE_PARAM_APIC_PASSWORD:-}}}" \
        go test -v ./mso/... -mod=vendor -run "$${ACC_TEST_REGEX}" -count=1 -timeout "$${ACC_TIMEOUT}"

labels:
  platform: linux/amd64